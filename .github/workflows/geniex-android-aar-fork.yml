name: Build Android AAR (fork, all-in-one)
 
# Builds the SDK inside the documented toolchain container (notes/build.md),
# then runs the same AAR packaging steps as the repo's "Build Android AAR"
# workflow, in one run. Trigger: Actions -> this workflow -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "CMake preset (see sdk/CMakePresets.json)"
        required: true
        default: "arm64-android-cpu-release"
      tag_suffix:
        description: "Suffix for the AAR file name"
        required: false
        default: "-cpu"
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h /
 
      - name: Checkout source (with submodules for the SDK build)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
 
      - name: Show the mmap code being built
        run: grep -rn "mmap_matrix" --include=*.cpp --include=*.h --include=*.hpp . || true
 
      - name: Build SDK in the Android toolchain container
        run: |
          docker run --rm -u $(id -u):$(id -g) \
            --volume $(pwd):/workspace \
            --workdir /workspace/sdk \
            -e CCACHE_DIR=/workspace/.ccache \
            --platform linux/amd64 \
            docker.io/qualcomm/geniex-toolchain-android:v0.1.0 \
            bash -c 'cmake --preset ${{ inputs.preset }} -B build-android . \
              && cmake --build build-android -j \
              && cmake --install build-android --prefix pkg-geniex'
          ls -la sdk/pkg-geniex/lib
 
      - name: Configure git
        shell: bash
        run: git config --global init.defaultBranch main
 
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
 
      # Versions must match bindings/android/app/build.gradle.kts.
      - name: Install Android SDK packages (sdkmanager)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be set on the runner}"
          sdkmanager_bin="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager_bin" ] || {
            echo "::error::sdkmanager not found at $sdkmanager_bin"; exit 1;
          }
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/29.0.14206865" >> "$GITHUB_ENV"
 
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('bindings/android/**/*.gradle*', 'bindings/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-
 
      - name: Assemble release AAR
        working-directory: bindings/android
        run: ./gradlew --no-daemon assembleRelease
 
      - name: Collect AAR
        id: aar
        shell: bash
        run: |
          set -euo pipefail
          src="bindings/android/app/build/outputs/aar/app-release.aar"
          [ -f "$src" ] || { echo "::error::AAR not found at $src"; exit 1; }
          mkdir -p dist-aar
          out="dist-aar/geniex-android-aar${{ inputs.tag_suffix }}.aar"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
 
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aar${{ inputs.tag_suffix }}
          path: ${{ steps.aar.outputs.path }}
          if-no-files-found: error
          retention-days: 7
